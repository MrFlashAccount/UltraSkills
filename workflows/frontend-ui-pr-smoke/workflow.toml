name = "frontend-ui-pr-smoke"
version = 1
description = "Experimental small UI workflow: draft and hostile-review a UI design proposal, obtain explicit human approval, implement the frontend slice, review frontend engineering and taste, then open or prepare a pull request. Use for testing the design-to-implementation path on small UI tasks; do not use for backend-heavy or high-risk product work."
start = "design_draft"
done = "done"

[steps.design_draft]
name = "Design artifact draft"
kind = "worker"
agent = "frontend-taste"

[steps.design_draft.input]
role = "frontend-taste"
prompt = '''This is a design-artifact phase for a small frontend UI PR smoke test.
Inspect the task, repo design memory, existing UI, screenshots/references if present, and relevant frontend-taste routing material. Do not edit files, run implementation, or author durable `DESIGN.md`.
Produce exactly one first-class HTML artifact named `ui-design-proposal` using the UI design proposal template and content_type `text/html`. This artifact is the design artifact that frontend implementation must follow.
The artifact should be an inspectable design proposal, not a prose-only markdown contract: include real-ish desktop/mobile frames, annotations, component inventory, icon/color/copy maps, product-level data hierarchy, selected pattern rules, wrapping/truncation rules, state examples, and flow/microinteraction sketches when useful.
The artifact must include: UI applicability, product/surface routing, design-basis preflight, user task, primary/secondary actions, user questions/decisions, first-read/work-surface hierarchy, screen/zones, product-level data hierarchy, content model/data hierarchy, text wrapping/truncation policy, required states, interactions, density/tone, responsive containment, visual evidence/proof assets, rendered-proof expectations, and open UI tensions.
For non-trivial UI, explicitly decide what each selected surface pattern should show, defer, truncate, or hide. Do not leave raw technical metadata, debug noise, or long token placement for implementation to guess.
For card/list UIs, specify card anatomy/content model and visual rules. For detail drawer/sidebar/bottom-sheet UIs, specify breakpoint behavior, containment, states, focus return, animation, and reduced-motion behavior. Do not introduce cards or drawers merely because the template supports them.
Define where wrapping is allowed and where it is forbidden. Buttons, tabs, segmented controls, chips, badges, pills, and compact status labels must not wrap unless the design basis explicitly approves it; long labels/tokens must be shortened, truncated, moved to detail, or otherwise contained. One-letter wraps are never acceptable proof.
For non-trivial UI, include 3-7 concrete user-facing questions or decisions with status Answered, Assumed, or Needs user approval. If an unanswered question would materially change layout, primary action, risk posture, density, visual direction, or proof expectations, return blocked with the smallest concrete question instead of guessing.
If no user-facing UI is involved, return blocked with blocker.source_step_id = design_draft; this workflow is only useful for UI smoke tests.
If the requested UI needs high-confidence new visual direction but the repo has no useful design basis, screenshot, reference, prior approved visual direction, or product context, return blocked with the smallest concrete request for a design brief, screenshot/reference, or create-design routing. Do not guess.
If the design basis is enough for a small conservative implementation, record the basis and proceed.
For taste-sensitive or materially new UI, compare 3-4 viable visual/composition directions within the available design basis inside the HTML artifact. Explain the trade-offs and identify one recommended direction; do not synthesize unsupported design law.
Return ready_for_attack for the initial proposal or a design_attack-requested revision, ready_for_approval after correcting an approve_design rejection, or blocked with blocker.source_step_id = design_draft. Never describe the draft as attacked or approved before those gates complete.
When revising after design_attack feedback or approve_design rejection, read input.design_attack and input.approve_design. If the latest approve_design output is rejected, return ready_for_approval after the correction so the revision returns directly to human approval instead of repeating the hostile attack.

Input context:
- Previous design artifacts: ${{ input.design_draft.artifacts | default: "No previous design artifact." }}
- Hostile design feedback: ${{ input.design_attack.verdict | default: "No prior hostile design feedback." }}
- Human design decision: ${{ input.approve_design | default: "No prior human design decision." }}
'''

[steps.design_draft.output]
template = "../../shared/templates/ui-design-proposal-template.html"
schema = "schemas/design-draft-output.json"

[steps.design_draft.next]
match = "${{ output.outcome }}"

[steps.design_draft.next.cases]
ready_for_attack = "design_attack"
ready_for_approval = "approve_design"

[steps.design_attack]
name = "Hostile design attack"
kind = "worker"
agent = "frontend-taste"

[steps.design_attack.input]
role = "frontend-taste"
prompt = '''This is a pre-implementation hostile design review. Inspect the `ui-design-proposal` HTML artifact and its evidence read-only; do not edit implementation files or invent `DESIGN.md`.
Start from a hostile prior. Attack user/task grounding, first-read hierarchy, typography/rhythm, spacing/composition, color/emphasis/contrast, focus-visible and target affordance, responsive containment, motion/reduced-motion, pathological states/data, evidence fidelity, and generic UI slop. Verify that taste-sensitive or materially new UI compares 3-4 viable directions within the available design basis before recommending one. Apply card/list and drawer/sidebar criteria only when those patterns are selected.
For taste-sensitive or materially new UI, require each direction to have its own inspectable rendered composition frame, a product-relevant structural/composition difference, and visible demonstration of typography/rhythm, spacing/composition, emphasis/contrast, focus-visible/target affordance, and motion/reduced-motion where applicable. Reject prose-only direction comparison, identical or near-identical frames merely relabeled or recolored, and filled contract tables or checklists unsupported by rendered frames. Accept a conservative/trivial existing-pattern exception only when the artifact names the exact existing pattern and evidence being preserved and does not disguise materially new UI as conservative work.
Return approved only when the artifact is ready for human choice, needs_revision for actionable design defects, or blocked with blocker.source_step_id = design_attack for missing external evidence or a user decision.

Input context:
- UI design proposal artifacts: ${{ input.design_draft.artifacts | default: "No design artifact is available." }}'''

[steps.design_attack.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "../dev-harness/schemas/gate-attack-verdict-output.json"

[steps.design_attack.next]
match = "${{ output.outcome }}"

[steps.design_attack.next.cases]
approved = "approve_design"
needs_revision = "design_draft"

[steps.approve_design]
name = "Approve UI design proposal"
kind = "approval"

[steps.approve_design.input]
prompt = '''Review design_draft.summary, attach the exact `ui-design-proposal` HTML artifact, and include design_attack.verdict on the first visit. Continue only after explicit human approval.
After a user-rejected proposal is corrected, return directly to this gate and treat the old attack verdict only as evidence about the previous version. Do not call the revised draft attacked or approved until the user decides.
Return approval approved to continue to implementation, rejected to revise design_draft, or blocked with the smallest concrete missing input.

Input context:
- UI design proposal summary: ${{ input.design_draft.summary }}
- UI design proposal artifacts: ${{ input.design_draft.artifacts | default: "No design artifact is available." }}
- Hostile design verdict: ${{ input.design_attack.verdict | default: "No prior hostile design verdict." }}
- Previous human design decision: ${{ input.approve_design | default: "No previous human design decision." }}'''

[steps.approve_design.output]
schema = "../dev-harness/schemas/approval-output.json"

[steps.approve_design.next]
match = "${{ output.approval }}"

[steps.approve_design.next.cases]
approved = "implementation"
rejected = "design_draft"

[steps.implementation]
name = "Frontend implementation"
kind = "fanout"
max_parallel = 1
next = "review"

[steps.implementation.input]
branches = ["frontend_implementation"]
prompt = '''Aggregate the frontend_implementation branch for this smoke workflow.
When implementation completed, return outcome ready_for_review with review_branches = ["frontend_review", "frontend_taste_review"] and one compact reviewer_handoffs entry for each reviewer.
If implementation is blocked, return blocked with blocker.source_step_id = implementation.

Input context:
- Frontend implementation output: ${{ input.frontend_implementation | default: "No frontend implementation output is available." }}
- Prior review rework handoff: ${{ input.review.implementer_handoffs.frontend_implementation | default: "No prior review rework handoff." }}'''

[steps.implementation.output]
template = "../../shared/templates/reviewer-handoff-template.md"
schema = "schemas/implementation-fanout-output.json"

[steps.implementation.branches.frontend_implementation]
name = "Frontend implementation"

[steps.implementation.branches.frontend_implementation.input]
role = "frontend"
prompt = '''Implement the small frontend UI slice described by `design_draft`'s exact `ui-design-proposal` HTML artifact after explicit `approve_design` approval.
Read the HTML artifact and approval evidence directly as the source of truth. Do not invent a different screen, density, hierarchy, state model, selected pattern, or visual evidence basis.
Before editing, inspect existing UI kit/design-system primitives, tokens, layout conventions, and nearby screens. Build a short component map from the design artifact and repo conventions, then implement against that map.
Use existing primitives by default. Create local named components/hooks/selectors for stable responsibilities: screen zones, feature panels, forms, lists/cards/tables, overlays, state surfaces, and derived state. Avoid one large page blob and avoid repeated className/token/control scaffolds.
For non-trivial UI, capture rendered proof evidence such as screenshots, local preview notes, or browser smoke checks when the app can run locally. If the app cannot be run locally, record why and what reviewer should inspect. Do not treat text-only evidence as complete when a rendered surface is available.
Run relevant tests/checks for this small slice. Fix failures caused by your changes. Return blocked only for missing external input, environment failure, or a design-contract contradiction that needs a user decision.
When implemented, emit one `implementation-handoff` artifact and compact JSON with changed_files and verification.

Input context:
- UI design proposal artifact: ${{ input.design_draft.artifacts | default: "No design artifact is available." }}
- Explicit UI design approval evidence: ${{ input.approve_design | default: "No human design approval is available." }}
- Prior implementation output after review changes: ${{ input.frontend_implementation | default: "No prior implementation output." }}
- Review feedback for frontend implementation: ${{ input.review.implementer_handoffs.frontend_implementation | default: "No prior review feedback." }}'''

[steps.implementation.branches.frontend_implementation.output]
template = "../../shared/templates/implementer-handoff-template.md"
schema = "../dev-harness/schemas/implementation-output.json"

[steps.review]
name = "Frontend reviews"
kind = "fanout"
max_parallel = 2
next = "${{ output.next }}"

[steps.review.input]
branches = "${{ input.implementation.review_branches }}"
prompt = '''Aggregate frontend_review and frontend_taste_review.
If either review has actionable current-scope must-fix or should-fix findings, return outcome needs_changes, next implementation, implementation_branches = ["frontend_implementation"], review_branches containing both reviewers as the mandatory re-review baseline, and an actionable implementer_handoffs.frontend_implementation.
If either review is blocked, return blocked with blocker.source_step_id = review and the smallest concrete missing input.
Return outcome passed and next pull_request only when both reviews passed.

Input context:
- Frontend review: ${{ input.frontend_review | default: "No frontend_review output." }}
- Frontend taste review: ${{ input.frontend_taste_review | default: "No frontend_taste_review output." }}'''

[steps.review.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/review-fanout-output.json"

[steps.review.branches.frontend_review]
name = "Frontend engineering review"

[steps.review.branches.frontend_review.input]
role = "frontend"
prompt = '''Review the frontend implementation for correctness, component decomposition, state ownership, accessibility-relevant behavior, use of existing UI kit/primitives/tokens, responsive behavior, and verification evidence.
Read the exact approved `ui-design-proposal` HTML, `approve_design` evidence, and `implementation-handoff`. Fail actionable current-scope issues, especially page blobs, copied control/style scaffolds, missing state surfaces, missing component map, inaccessible interactions, missing product-level data hierarchy, missing applicable selected-pattern contracts, missing responsive containment, missing reduced-motion handling, or implementation that ignores the design artifact.
Return passed, needs_changes with required_implementation_steps = ["frontend_implementation"], or blocked.

Input context:
- UI design proposal artifact: ${{ input.design_draft.artifacts | default: "No design artifact is available." }}
- Explicit UI design approval evidence: ${{ input.approve_design | default: "No human design approval is available." }}
- Frontend implementation output: ${{ input.frontend_implementation | default: "No frontend implementation output is available." }}'''

[steps.review.branches.frontend_review.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "../dev-harness/schemas/gate-review-verdict-output.json"

[steps.review.branches.frontend_taste_review]
name = "Frontend taste review"

[steps.review.branches.frontend_taste_review.input]
role = "frontend-taste"
prompt = '''Review the implemented UI against the exact approved `ui-design-proposal` HTML, explicit `approve_design` evidence, repo `DESIGN.md` when it actually exists or the recorded design basis, existing UI, screenshots/references/proof assets, and frontend-taste quality criteria.
Focus on product-surface quality: first read, hierarchy, product-level data hierarchy, content model/data hierarchy, typography/rhythm, spacing/composition, color/emphasis/contrast, focus-visible and target affordance, density, tone, states, interaction feel, responsive containment, motion/reduced-motion, rendered-proof fidelity, and avoidance of generic UI slop. Check whether selected surface patterns show the right facts at the right priority instead of leaking debug dumps. Apply card/list and drawer/sidebar criteria only when those patterns were approved. Do not invent `DESIGN.md` or take ownership of code architecture except when visible composition failure affects the surface.
Treat wrapped chips, badges, pills, compact status labels, buttons, tabs, segmented controls, or one-letter text wraps as current-scope visual defects unless the `ui-design-proposal` explicitly allowed that behavior for the surface. Long ids/tokens must be contained with a deliberate truncation/detail/copy policy, not accidental wrapping.
For non-trivial UI that can render locally, missing screenshot/rendered proof is a current-scope review finding. Return needs_changes unless the implementation gives a concrete environment blocker explaining why proof could not be captured.
Return passed, needs_changes with required_implementation_steps = ["frontend_implementation"], or blocked.

Input context:
- UI design proposal artifact: ${{ input.design_draft.artifacts | default: "No design artifact is available." }}
- Explicit UI design approval evidence: ${{ input.approve_design | default: "No human design approval is available." }}
- Frontend implementation output: ${{ input.frontend_implementation | default: "No frontend implementation output is available." }}'''

[steps.review.branches.frontend_taste_review.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "../dev-harness/schemas/gate-review-verdict-output.json"

[steps.pull_request]
name = "Open pull request"
kind = "worker"
next = "done"

[steps.pull_request.input]
prompt = '''Open or prepare a pull request for the reviewed frontend UI smoke-test implementation.
First inspect git status, branch, commit history, and remote. Ensure only intended files are included. Commit the changes with a concise message if they are not committed yet.
If the current user request or workflow invocation clearly permits pushing and opening a PR, push the branch and open a PR against the base branch named by the task prompt; if no base branch is named, use the repository default branch. If explicit external-write permission is absent or credentials/tools are unavailable, return blocked with the exact command/handoff needed instead of pretending a PR was opened.
Record the PR URL, branch, commit, and verification results.

Input context:
- UI design proposal artifact: ${{ input.design_draft.artifacts | default: "No design artifact is available." }}
- Frontend implementation output: ${{ input.frontend_implementation | default: "No frontend implementation output is available." }}
- Frontend review: ${{ input.frontend_review | default: "No frontend_review output." }}
- Frontend taste review: ${{ input.frontend_taste_review | default: "No frontend_taste_review output." }}'''

[steps.pull_request.output]
template = "../../shared/templates/pull-request-handoff-template.md"
schema = "schemas/pull-request-output.json"

[steps.done]
name = "Done"
kind = "done"

[steps.done.input]
prompt = '''Frontend UI PR smoke workflow completed.'''
