On the first pass, architecture_draft.selected_review_steps is the mandatory review baseline. After rework, review.review_branches is the mandatory re-review baseline.
You may widen that baseline when actual changed files or touched surfaces require another planned or previously skipped reviewer. Never remove a mandatory reviewer.
Always emit a concise user-facing summary of the current implementation state and copy every selected branch's `implementation-handoff` artifact metadata into artifacts[] without embedding or merging artifact bodies.
When the latest approve_implementation decision is rejected, verify that every selected branch addressed the user feedback within its owned scope, then return outcome ready_for_user_approval without review_branches or reviewer_handoffs. This user-requested rework returns directly to the same user gate; do not silently insert another automated review cycle.
Otherwise return outcome ready_for_review with review_branches as the exact next review fanout and one reviewer_handoffs.<review_branch_id> entry per selected reviewer.
If incomplete, report a non-blocking stop with non_blocking_stop.source_step_id = implementation.

