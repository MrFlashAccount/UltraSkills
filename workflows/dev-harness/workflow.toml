name = "dev-harness"
version = 1
description = "End-to-end planning and execution workflow for non-trivial code work: research attack, optional UI design proposal gate, architecture gate, implementation plan, approval, implementation fanout, and review fanout. Use when a task needs structured evidence, staged approvals, role delegation, implementation slicing, or coordinated review before completion. Do not use when the user only needs a lightweight research verdict, a simple direct fix, a one-shot answer, or workflow creation/design."
start = "research_draft"
done = "done"

[steps.research_draft]
name = "Research draft"
kind = "worker"
agent = "researcher"
agent_runtime.codex = { model = "gpt-5.6-luna", thinking_level = "xhigh" }

[steps.research_draft.input]
role = "researcher"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Before creating the research artifact or moving toward a proposal, run a user dialogue solution exploration pass when the feature/task is under-specified, has meaningful product/API/architecture choices, or would otherwise force hidden assumptions:
- Inspect the codebase first for questions answerable from existing code, docs, tests, contracts, or prior artifacts.
- When multiple plausible solution directions remain, report a non-blocking stop with non_blocking_stop.source_step_id = research_draft and a user-facing discussion prompt in non_blocking_stop.needed for the orchestrator to discuss with the user through the non-blocking stop flow.
- The discussion prompt must present the main solution options, trade-offs, edge cases, failure modes, migration/compatibility impact, operational cost, and your recommended direction.
- Ask one focused discussion question at a time. After the orchestrator resolves it, continue the same research step and either ask the next needed discussion question or proceed only when the solution direction, edge cases, and scope decisions are resolved.
- Phrase every user-answerable non_blocking_stop.needed as a direct user-facing question; the orchestrator must route it to the user as a question, not answer it from inference or convert it into a summary.
Do not create `reasons-canvas-research` before the needed user dialogue is complete or evidence shows no user dialogue is needed.
Read the task context, gather local/project evidence, identify constraints, risks, open questions, and architecture-sensitive pressure.
Create exactly one first-class human-facing research artifact named `reasons-canvas-research`. Do not create any separate legacy research artifact or structured legacy output.
Fill only the research-owned depth in `reasons-canvas-research`: evidence-backed Requirements, observed domain Entities, and research-level constraints, candidate options, risks, norms, safeguards, and open tensions. Do not finalize architecture, file-level operations, or implementation work; mark those as questions or constraints for later phases. Emit artifact metadata for `reasons-canvas-research` in artifacts[].
Emit a compact output.summary as the human-facing research proposal state for approval gates. Summarize the artifact's current proposal state, major decisions, unresolved tensions, and why it is ready for attack/approval without embedding the artifact body.
Do not create arbitrary temp/export files for handoff; the artifact metadata/path accepted into baton is the source of truth.
Return outcome ready_for_attack when the initial draft or a research_attack-requested revision is ready for attack.
When missing implementation-critical input is answerable by the user, report a non-blocking stop with non_blocking_stop.source_step_id = research_draft and the smallest concrete question or permission needed.
For any user-answerable research non-blocking stop, non_blocking_stop.needed must be the exact user-facing question to ask.
Report a non-blocking stop for non-user-answerable unsafe or impossible progress as well, but make non_blocking_stop.needed distinguish the external non-blocking stop from a user decision.
When revising after research_attack feedback or approve_research rejection, read feedback from input.research_attack and input.approve_research and address it explicitly while preserving approved constraints. If the latest approve_research output is rejected, return ready_for_approval after the correction; do not send that user-requested revision through research_attack again.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = research_draft and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Previous research artifacts: ${{ input.research_draft.artifacts | default: "No previous research artifacts in input context." }}
- Research attack feedback to address: ${{ input.research_attack.verdict | default: "No prior research_attack feedback." }}
- Human research gate feedback to address: ${{ input.approve_research | default: "No prior approve_research decision or feedback." }}'''

[steps.research_draft.output]
template = "../../shared/templates/reasons/reasons-canvas-template.md"
schema = "schemas/research-draft-output.json"

[steps.research_draft.next]
match = "${{ output.outcome }}"

[steps.research_draft.next.cases]
ready_for_attack = "research_attack"
ready_for_approval = "approve_research"

[steps.research_attack]
name = "Research attack"
kind = "worker"
agent = "research_critic"
agent_runtime.codex = { model = "gpt-5.6-sol", thinking_level = "high" }

[steps.research_attack.input]
role = "researcher"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Start from a hostile prior: assume the change, proposal, draft, or Canvas is wrong, incomplete, overcomplicated, or under-evidenced until the artifact proves otherwise. Do not give credit for intent, author confidence, green self-reports, or plausible-sounding structure. PASS is allowed only after serious attack finds no evidence-backed must-fix finding. Do not invent bugs. Any FAIL must be evidence-backed with file/function/line or equivalent precise location, and explain why existing tests/checks did not catch it. Prefer small, evidence-backed blockers over broad commentary.
Read artifact `reasons-canvas-research` from `research_draft` and attack it for missing evidence, unsafe assumptions, scope drift, sensitive surfaces, unclear approval questions, and fake architecture/implementation certainty. Treat a missing `reasons-canvas-research` artifact as a blocking research failure.
Return approved or needs_revision as completed output; otherwise report a non-blocking stop.
When reporting it, set non_blocking_stop.source_step_id = research_attack.

Input context:
- Research artifacts: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}'''

[steps.research_attack.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/gate-attack-verdict-output.json"

[steps.research_attack.next]
match = "${{ output.outcome }}"

[steps.research_attack.next.cases]
approved = "approve_research"
needs_revision = "research_draft"

[steps.approve_research]
name = "Approve research"
kind = "approval"

[steps.approve_research.input]
prompt = '''This is a non-implementation approval phase. Do not inspect code, diffs, docs, or attached artifact bodies merely to prepare this gate; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Read research_draft.summary as the human-facing research proposal state and attach the `reasons-canvas-research` artifact from `research_draft`. On the first visit, include research_attack.verdict. After a user-rejected draft is corrected, return directly to this gate and treat the old attack verdict only as evidence about the previous version; do not present it as critique of the revised artifact.
Do not recreate a summary by reading/paraphrasing the artifact body in the orchestrator; use the draft-produced summary as the approval-state text.
If the user asks for a packet/proposal file, retrieve/export the existing artifact referenced by baton/output artifacts; do not ask a worker to recreate it in a temp path.
Continue only after explicit approval.
Return approval approved to continue to ui_intent_draft or rejected to revise research_draft as completed output; otherwise report a non-blocking stop.

Input context:
- Research summary for approval: ${{ input.research_draft.summary }}
- Research attack verdict: ${{ input.research_attack.verdict }}
- Previous research gate decision: ${{ input.approve_research | default: "No previous research gate decision." }}
- Research artifacts: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}'''

[steps.approve_research.output]
schema = "schemas/approval-output.json"

[steps.approve_research.next]
match = "${{ output.approval }}"

[steps.approve_research.next.cases]
approved = "ui_intent_draft"
rejected = "research_draft"

[steps.ui_intent_draft]
name = "UI design proposal draft"
kind = "worker"
agent = "frontend-taste"

[steps.ui_intent_draft.input]
role = "frontend-taste"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Use frontend-taste judgment. Read the approved/current `reasons-canvas-research` artifact from `research_draft` as the source of truth and produce exactly one first-class human-facing HTML artifact named `ui-design-proposal` with content_type `text/html`.
This step is a lightweight UI/product-surface design proposal gate before architecture, not a separate design-law authoring workflow. It must not edit or invent `DESIGN.md`, choose durable visual law, or define file/component implementation architecture. The design-routing logic belongs inside `ui-design-proposal`: product/surface route, design-basis preflight, user decisions, visually comparable direction frames when needed, chosen desktop/mobile proof, annotations, component and copy inventory, typography/rhythm, spacing/composition, color/emphasis/contrast, focus-visible/target affordance, motion/reduced-motion, wrapping/truncation, product-level data hierarchy, evidence/proof expectations, open tensions, portable frontend-taste guidance allowed, what must not be inferred, and whether create-design/frontend-taste direction work is required before architecture. Include card/list anatomy and visual rules only when that pattern is selected; include drawer/sidebar/bottom-sheet placement and states only when that pattern is selected.
If the approved research has no user-facing UI surface, or only trivial UI copy/bug work, still create `ui-design-proposal` with a clear "not applicable / no UI design proposal gate needed" decision and summary so downstream steps know the gate was considered.
For non-trivial user-facing UI, the `ui-design-proposal` must capture the interface intent at product-surface depth: user/task, primary and secondary actions, user questions/decisions, first-read/work-surface reading order, screen/zones needed, product-level data hierarchy, content model/data hierarchy, text wrapping/truncation policy, required visible states, interaction expectations, density/tone, responsive containment, design-law or existing-UI basis, visual evidence/proof assets, rendered-proof expectations, and any UI open tensions that architecture must preserve. Describe semantic screen structure such as toolbar, filters, list/table, detail drawer/sidebar, form, dialog, empty/error/loading states; do not choose file paths, component filenames, hooks, state owners, or storage boundaries.
For non-trivial UI, explicitly decide what each selected surface pattern should show, defer, truncate, or hide. Do not leave raw technical metadata, debug noise, or long token placement for implementation to guess. When card/list patterns are selected, specify their anatomy/content model and visual rules. When drawer/sidebar/bottom-sheet patterns are selected, specify breakpoint placement, containment, open/closed/no-selection behavior, focus return, animation, and reduced-motion behavior. Do not introduce cards or drawers merely because the template supports them. Define where wrapping is allowed and where it is forbidden: buttons, tabs, segmented controls, chips, badges, pills, and compact status labels must not wrap unless the design basis explicitly approves it; long labels/tokens must be shortened, truncated, moved to detail, or otherwise contained. One-letter wraps are never acceptable proof.
Always include a `User Questions / Decisions` section for non-trivial UI. Put 3-7 concrete user-facing questions or decisions there when useful, with status Answered, Assumed, or Needs user approval. If an unanswered question materially changes layout, primary action, risk posture, density, or visual direction, return blocked with the smallest concrete user-facing question instead of guessing.
Use existing screenshots, approved reference images, proof pages, generated mockups, prior visual proposals, or current UI captures as visual evidence when they are already available in the task/repo/context. Record what each asset proves and what frontend should preserve or ignore. For non-trivial UI, explicitly state the rendered proof/screenshots the implementation or review must capture; do not silently accept text-only evidence when the surface can be rendered locally.
If design law, existing UI basis, product context, visual evidence, or user choice is missing and the task needs high-confidence new screen direction, return blocked with blocker.source_step_id = ui_intent_draft and the smallest concrete user-facing question, screenshot/proof request, or create-design/frontend-taste routing need. For small conservative UI work, record the fallback basis instead of blocking.
Emit artifact metadata for `ui-design-proposal` in artifacts[] with content_type `text/html` and a compact output.summary as the human-facing UI design proposal state.
Return ready_for_attack for the initial proposal or a ui_intent_attack-requested revision, ready_for_approval after correcting an approve_ui_intent rejection, or blocked with blocker.source_step_id = ui_intent_draft.
When revising after ui_intent_attack feedback or approve_ui_intent rejection, read feedback from input.ui_intent_attack and input.approve_ui_intent and address it explicitly while preserving approved research constraints. If the latest approve_ui_intent output is rejected, return ready_for_approval after the correction; do not send that user-requested revision through ui_intent_attack again.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; return a recoverable blocked output with blocker.source_step_id = ui_intent_draft and put the user-facing clarification prompt in blocker.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Research artifacts, including required `reasons-canvas-research`: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}
- Research attack verdict: ${{ input.research_attack.verdict }}
- Human research approval: ${{ input.approve_research }}
- Previous UI design proposal artifacts: ${{ input.ui_intent_draft.artifacts | default: "No previous ui_intent_draft artifacts in input context." }}
- UI design proposal attack feedback to address: ${{ input.ui_intent_attack.verdict | default: "No prior ui_intent_attack feedback." }}
- Human UI design proposal gate feedback to address: ${{ input.approve_ui_intent | default: "No prior approve_ui_intent decision or feedback." }}'''

[steps.ui_intent_draft.output]
template = "../../shared/templates/ui-design-proposal-template.html"
schema = "schemas/ui-intent-draft-output.json"

[steps.ui_intent_draft.next]
match = "${{ output.outcome }}"

[steps.ui_intent_draft.next.cases]
ready_for_attack = "ui_intent_attack"
ready_for_approval = "approve_ui_intent"

[steps.ui_intent_attack]
name = "UI design proposal attack"
kind = "worker"
agent = "frontend-taste"

[steps.ui_intent_attack.input]
role = "frontend-taste"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Start from a hostile prior: assume the UI design proposal draft is wrong, incomplete, overcomplicated, unsupported by research, or drifting into design-law/code architecture until the artifact proves otherwise. Do not give credit for intent, author confidence, or plausible-sounding structure.
Read artifact `ui-design-proposal` from `ui_intent_draft` and attack it for missing user/task grounding, weak first-read/action hierarchy, hierarchy defects, weak typography or rhythm, inconsistent spacing or composition, arbitrary color/emphasis or insufficient contrast, missing focus-visible or target affordance, broken responsive containment, purposeless motion or missing reduced-motion behavior, generic UI slop, missing product-level data hierarchy, missing applicable-pattern anatomy/state rules, missing wrapping/truncation policy, missing required states, unsupported design basis, missing product/surface routing, missing or misused visual evidence/proof assets, hidden assumptions, over-specific code/component architecture, and failure to mark non-UI/trivial UI work as not applicable. Card/list and drawer/sidebar concerns apply only when the proposal selects those patterns; do not require or invent them for forms, tables, documents, navigation, or other surfaces. Do not invent `DESIGN.md` or treat its absence as permission to create design law. Treat a missing `ui-design-proposal` artifact as a blocking UI design proposal failure.
For taste-sensitive or materially new UI, require 3-4 viable directions and require each direction to have its own inspectable rendered composition frame, a product-relevant structural/composition difference, and visible demonstration of typography/rhythm, spacing/composition, emphasis/contrast, focus-visible/target affordance, and motion/reduced-motion where applicable. Reject prose-only direction comparison, identical or near-identical frames merely relabeled or recolored, and filled contract tables or checklists unsupported by the rendered frames. A conservative/trivial existing-pattern exception is valid only when the artifact names the exact existing pattern and evidence being preserved and does not disguise materially new UI as conservative work.
Return approved, needs_revision, or blocked.
If blocked, set blocker.source_step_id = ui_intent_attack.

Input context:
- UI design proposal artifacts: ${{ input.ui_intent_draft.artifacts | default: "No UI design proposal artifacts are available in input context." }}
- Research artifacts: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}'''

[steps.ui_intent_attack.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/gate-attack-verdict-output.json"

[steps.ui_intent_attack.next]
match = "${{ output.outcome }}"

[steps.ui_intent_attack.next.cases]
approved = "approve_ui_intent"
needs_revision = "ui_intent_draft"

[steps.approve_ui_intent]
name = "Approve UI design proposal"
kind = "approval"

[steps.approve_ui_intent.input]
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Read ui_intent_draft.summary as the human-facing UI design proposal state and attach the `ui-design-proposal` artifact from ui_intent_draft. On the first visit, include ui_intent_attack.verdict. After a user-rejected proposal is corrected, return directly to this gate and treat the old attack verdict only as evidence about the previous version; do not present it as critique of the revised artifact.
Do not recreate a summary by reading/paraphrasing the artifact body in the orchestrator; use the draft-produced summary as the approval-state text.
If the user asks for a UI design proposal file, retrieve/export the existing artifact referenced by baton/output artifacts, limited to `ui-design-proposal`. Do not ask a worker to recreate it in a temp path.
Continue only after explicit approval.
Return approval approved to continue to architecture_draft, rejected to revise ui_intent_draft, or blocked with a blocker.

Input context:
- UI design proposal summary for approval: ${{ input.ui_intent_draft.summary }}
- UI design proposal attack verdict: ${{ input.ui_intent_attack.verdict }}
- UI design proposal artifacts: ${{ input.ui_intent_draft.artifacts | default: "No UI design proposal artifacts are available in input context." }}'''

[steps.approve_ui_intent.output]
schema = "schemas/approval-output.json"

[steps.approve_ui_intent.next]
match = "${{ output.approval }}"

[steps.approve_ui_intent.next.cases]
approved = "architecture_draft"
rejected = "ui_intent_draft"

[steps.architecture_draft]
name = "Architecture draft"
kind = "worker"
agent = "architect"
agent_runtime.codex = { model = "gpt-5.6-luna", thinking_level = "xhigh" }

[steps.architecture_draft.input]
role = "architect"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Read the approved/current `reasons-canvas-research` artifact from `research_draft` as the research source of truth and strictly follow it.
Read the approved/current `ui-design-proposal` artifact from `ui_intent_draft` as the UI/product-surface source of truth when it is applicable. Preserve its user task, product/surface route, screen/zones, first-read/action hierarchy, required states, interaction expectations, design-law basis, visual evidence/proof asset constraints, and open UI tensions. Do not rewrite visual hierarchy or UI taste in architecture; translate only the code/system implications needed to preserve the approved UI design proposal.
Produce the minimal architecture decision or structural contract required by the approved research in the `reasons-canvas-architecture` artifact and a compact output.summary as the human-facing architecture proposal state for approval gates. Do not embed the architecture artifact body in JSON.
Before finalizing output.summary or `reasons-canvas-architecture`, explicitly identify the public contract and API surfaces affected by the task: exported APIs, CLI/user-facing commands, schemas, workflow interfaces, integration boundaries, compatibility promises, and observable behavior. If code, docs, or existing contracts answer a question, inspect them instead of asking the user.
When user-owned choices remain about public contract shape, API compatibility, naming, migration behavior, or accepted breakage, report a non-blocking stop with non_blocking_stop.source_step_id = architecture_draft and the smallest focused non_blocking_stop.needed question for the orchestrator to resolve through the non-blocking stop flow; include your recommended answer in non_blocking_stop.summary or non_blocking_stop.needed.
For any user-answerable architecture non-blocking stop, non_blocking_stop.needed must be the exact user-facing question to ask; the orchestrator must route it to the user as a question, not answer it from inference or convert it into a summary.
After the orchestrator resolves the recoverable non-blocking stop, continue the same architecture step from the resolved public contract/API decision and proceed only when the needed decisions are resolved or evidence shows no such discussion is needed.
When `reasons-canvas-research` exists, derive one new immutable human-facing workflow artifact named `reasons-canvas-architecture`. Copy forward research-owned Requirements and observed domain Entities as frozen input unless new evidence proves a conflict; record any correction in the new architecture artifact instead of editing the research artifact. Own the architecture-depth sections: structural Entities, Approach, Structure, Operations at planning depth, Norms, Safeguards, and remaining open tensions.
Do not create arbitrary temp/export files for handoff; the artifact metadata/path accepted into baton is the source of truth.
If architecture work is minimal, record the explicit minimal/no-structural-change decision in `reasons-canvas-architecture` and output.summary.
Return ready_for_attack for the initial draft or an architecture_attack-requested revision as completed output, or report a non-blocking stop with non_blocking_stop.source_step_id = architecture_draft.
When revising after architecture_attack feedback or approve_architecture rejection, read feedback from input.architecture_attack and input.approve_architecture and address it explicitly while preserving frozen research inputs and approved architecture constraints. If the latest approve_architecture output is rejected, return ready_for_approval after the correction; do not send that user-requested revision through architecture_attack again.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = architecture_draft and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Research artifacts, including required `reasons-canvas-research`: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}
- Research attack verdict: ${{ input.research_attack.verdict }}
- Human research approval: ${{ input.approve_research }}
- UI design proposal artifacts, including `ui-design-proposal` when present: ${{ input.ui_intent_draft.artifacts | default: "No UI design proposal artifacts are available in input context." }}
- UI design proposal attack verdict: ${{ input.ui_intent_attack.verdict | default: "No UI design proposal attack verdict is available." }}
- Human UI design proposal approval: ${{ input.approve_ui_intent | default: "No UI design proposal approval is available." }}
- Previous architecture artifacts: ${{ input.architecture_draft.artifacts | default: "No previous architecture_draft artifacts in input context." }}
- Architecture attack feedback to address: ${{ input.architecture_attack.verdict | default: "No prior architecture_attack feedback." }}
- Human architecture gate feedback to address: ${{ input.approve_architecture | default: "No prior approve_architecture decision or feedback." }}'''

[steps.architecture_draft.output]
template = "../../shared/templates/reasons/reasons-canvas-template.md"
schema = "schemas/architecture-draft-output.json"

[steps.architecture_draft.next]
match = "${{ output.outcome }}"

[steps.architecture_draft.next.cases]
ready_for_attack = "architecture_attack"
ready_for_approval = "approve_architecture"

[steps.architecture_attack]
name = "Architecture attack"
kind = "worker"
agent = "architecture_critic"
agent_runtime.codex = { model = "gpt-5.6-sol", thinking_level = "high" }

[steps.architecture_attack.input]
role = "architect"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Start from a hostile prior: assume the change, proposal, draft, or packet is wrong, incomplete, overcomplicated, or under-evidenced until the artifact proves otherwise. Do not give credit for intent, author confidence, green self-reports, or plausible-sounding structure. PASS is allowed only after serious attack finds no evidence-backed must-fix finding. Do not invent bugs. Any FAIL must be evidence-backed with file/function/line or equivalent precise location, and explain why existing tests/checks did not catch it. Prefer small, evidence-backed blockers over broad commentary.
Attack the required `reasons-canvas-architecture` artifact for ownership seams, dependency direction, contract surfaces, frozen research carry-forward, architecture-owned decisions, operations clarity, and compatibility risk. Treat a missing `reasons-canvas-architecture` artifact as a blocking architecture failure.
Return approved or needs_revision as completed output; otherwise report a non-blocking stop.
When reporting it, set non_blocking_stop.source_step_id = architecture_attack.

Input context:
- Architecture artifacts: ${{ input.architecture_draft.artifacts | default: "No architecture artifacts are available in input context." }}'''

[steps.architecture_attack.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/gate-attack-verdict-output.json"

[steps.architecture_attack.next]
match = "${{ output.outcome }}"

[steps.architecture_attack.next.cases]
approved = "approve_architecture"
needs_revision = "architecture_draft"

[steps.approve_architecture]
name = "Approve architecture"
kind = "approval"

[steps.approve_architecture.input]
prompt = '''This is a non-implementation approval phase. Do not inspect code, diffs, docs, or attached artifact bodies merely to prepare this gate; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Read architecture_draft.summary as the human-facing architecture proposal state and attach the `reasons-canvas-architecture` artifact. On the first visit, include architecture_attack.verdict. After a user-rejected draft is corrected, return directly to this gate and treat the old attack verdict only as evidence about the previous version; do not present it as critique of the revised artifact.
Do not recreate a summary by reading/paraphrasing the artifact body in the orchestrator; use the draft-produced summary as the approval-state text.
If the user asks for an architecture file, retrieve/export the existing artifact referenced by baton/output artifacts, limited to `reasons-canvas-architecture`. Do not ask a worker to recreate it in a temp path.
Continue only after explicit approval when the slice is non-trivial or architecture-sensitive.
Return approval approved to continue to planning_draft or rejected to revise architecture_draft as completed output; otherwise report a non-blocking stop.

Input context:
- Architecture summary for approval: ${{ input.architecture_draft.summary }}
- Architecture attack verdict: ${{ input.architecture_attack.verdict }}
- Previous architecture gate decision: ${{ input.approve_architecture | default: "No previous architecture gate decision." }}
- Architecture artifacts: ${{ input.architecture_draft.artifacts | default: "No architecture artifacts are available in input context." }}'''

[steps.approve_architecture.output]
schema = "schemas/approval-output.json"

[steps.approve_architecture.next]
match = "${{ output.approval }}"

[steps.approve_architecture.next.cases]
approved = "planning_draft"
rejected = "architecture_draft"

[steps.planning_draft]
name = "Planning contract draft"
kind = "worker"
agent = "architect"
agent_runtime.codex = { model = "gpt-5.6-luna", thinking_level = "xhigh" }

[steps.planning_draft.input]
role = "architect"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Produce the implementation plan contract for approval from the approved `reasons-canvas-architecture` artifact and the approved `ui-design-proposal` artifact when applicable. Treat `reasons-canvas-architecture` and `ui-design-proposal` as immutable source contracts: do not edit them, complete missing sections, or read earlier research artifacts separately. Convert the approved architecture and UI design proposal artifacts into workstreams, owners, verification, rollback, and reviewer selection in one file-backed artifact.
Create exactly one first-class human-facing implementation plan artifact named `implementation-plan` and emit its artifact metadata in artifacts[]. Do not embed the readable plan/proposal body in JSON; keep JSON close to research/architecture draft outputs: outcome, compact summary, artifact metadata, routing fields, selected reviewer fields, and blockers only.
When a `ui-design-proposal` is applicable to the slice, the `implementation-plan` artifact must include a `UI Design Proposal` section that carries forward its user/task, product/surface route, primary actions, first-read hierarchy, screen/zones, product-level data hierarchy, selected pattern contracts, animation/reduced-motion behavior, responsive containment, required states, interaction expectations, density/tone, design-law or existing-UI basis, and visual evidence/proof asset expectations. Include card/list anatomy and selection rules only when a card/list pattern is selected. Include drawer/sidebar/bottom-sheet placement and state rules only when a detail-overlay pattern is selected. If the UI design proposal artifact says no UI design proposal gate is needed, record that reason instead of inventing UI design proposal.
When selected_implementation_steps includes frontend_implementation for non-trivial user-facing UI, the `implementation-plan` artifact must include a `Frontend composition plan` section naming page/screen containers, feature components, layout components, primitives/UI-kit usage, overlays/composites, state surfaces, hooks/selectors/adapters, file zones, and responsibility boundaries. If the frontend slice is non-UI, trivial, or intentionally preserves an existing component shape, record that reason in the section. Treat a missing required frontend composition plan as a planning blocker, not an implementation detail to improvise later.
Emit a compact output.summary as the human-facing plan proposal state for approval gates. Summarize the artifact's current plan state, selected implementation route, selected reviewers, main risks, and verification/rollback shape without embedding the full plan body.
The step id remains planning_draft for compatibility, but once approve_plan approves this output, downstream steps must treat it as the final approved plan contract. selected_implementation_steps must contain only unique canonical implementation branch ids needed for the plan: backend_implementation, frontend_implementation, architecture_artifact_update.
Collapse overlapping same-role work into one canonical task; do not create duplicate backend/frontend/architecture workers.
If duplicate same-role work cannot be safely collapsed, report a non-blocking stop with non_blocking_stop.source_step_id = planning_draft. selected_review_steps must explicitly contain the unique reviewers that must run after implementation; implementation must not invent or recompute reviewers.
Keep review_plan.reviewers aligned with selected_review_steps.
When frontend_implementation is selected for applicable non-trivial user-facing UI, selected_review_steps must include both frontend_review and frontend_taste_review as one mandatory pair. Do not prune either half of this engineering-plus-visible-quality gate or treat one as optional/skipped coverage.
Reviewer fan-out budget: default to one independent reviewer, use two when two independent material risk classes are touched, use three for structural/runtime plus verification-heavy work, and select more than three only with review_escalation explaining the independent risk classes. selected_review_steps means "run these reviewers"; do not include optional, informational, or absence-confirmation reviewers. Record considered-but-skipped reviewers in skipped_review_steps with an evidence-backed reason instead.
Return ready_for_attack for the initial plan or a planning_attack-requested revision as completed output, or report a non-blocking stop with non_blocking_stop.source_step_id = planning_draft.
When revising after planning_attack feedback or approve_plan rejection, read feedback from input.planning_attack and input.approve_plan and address it explicitly while preserving the approved architecture constraints. If the latest approve_plan output is rejected, return ready_for_approval after the correction; do not send that user-requested revision through planning_attack again.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = planning_draft and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Architecture artifacts, including `reasons-canvas-architecture` when present: ${{ input.architecture_draft.artifacts | default: "No architecture artifacts are available in input context." }}
- Architecture attack verdict: ${{ input.architecture_attack.verdict }}
- UI design proposal artifacts, including `ui-design-proposal` when present: ${{ input.ui_intent_draft.artifacts | default: "No UI design proposal artifacts are available in input context." }}
- UI design proposal approval: ${{ input.approve_ui_intent | default: "No UI design proposal approval is available." }}
- Previous implementation plan artifacts: ${{ input.planning_draft.artifacts | default: "No previous planning_draft implementation artifacts in input context." }}
- Planning attack feedback to address: ${{ input.planning_attack.verdict | default: "No prior planning_attack feedback." }}
- Human plan gate feedback to address: ${{ input.approve_plan | default: "No prior approve_plan decision or feedback." }}'''

[steps.planning_draft.output]
template = "../../shared/templates/implementation-plan-template.md"
schema = "schemas/planning-draft-output.json"

[steps.planning_draft.next]
match = "${{ output.outcome }}"

[steps.planning_draft.next.cases]
ready_for_attack = "planning_attack"
ready_for_approval = "approve_plan"

[steps.planning_attack]
name = "Planning attack"
kind = "worker"
agent = "planning_critic"
agent_runtime.codex = { model = "gpt-5.6-sol", thinking_level = "high" }

[steps.planning_attack.input]
role = "critic"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Read artifact `implementation-plan` from `planning_draft` and challenge it plus selected_implementation_steps, selected_review_steps, review_plan, skipped_review_steps, and review_escalation for faithful conversion from approved architecture artifacts and immutable `reasons-canvas-architecture` when present into workstreams, unique canonical task selection, explicit final reviewer selection, no duplicate same-role workers, entity coverage, one-owner-per-file-zone, project baseline, architecture artifact manifest, verification/rollback surfaces, sensitive surfaces, request-path/contract touchpoints, and max-detail leaks. Treat a missing `implementation-plan` artifact as a blocking planning failure.
When a `ui-design-proposal` is applicable, challenge the implementation-plan for faithful carry-forward of the UI design proposal: user/task, product/surface route, primary actions, first-read hierarchy, screen/zones, product-level data hierarchy, selected pattern contracts, animation/reduced-motion behavior, responsive containment, required states, interaction expectations, density/tone, design-law/existing-UI basis, and visual evidence/proof asset expectations. Require card/list or drawer/sidebar details only when those patterns are selected. If the plan ignores, rewrites, or invents UI design proposal instead of carrying it forward, return needs_revision or report a non-blocking stop as appropriate.
When frontend_implementation is selected for non-trivial user-facing UI, challenge the implementation-plan for a concrete `Frontend composition plan`: page/screen containers, feature components, layout components, primitives/UI-kit usage, overlays/composites, state surfaces, hooks/selectors/adapters, file zones, responsibility boundaries, state ownership, and UI-kit/token evidence. If the plan omits this, treats it as cosmetic, leaves component architecture for implementation to invent, or lacks review criteria for component decomposition, return needs_revision or report a non-blocking stop as appropriate.
When frontend_implementation is selected for applicable non-trivial user-facing UI, require both frontend_review and frontend_taste_review in selected_review_steps and review_plan. Missing either mandatory half is a planning failure.
Return approved or needs_revision as completed output; otherwise report a non-blocking stop.
If selected tasks contain duplicate/overlapping same-role work that cannot collapse to one canonical step, if selected_review_steps includes reviewers only to confirm absence of a surface, if optional reviewers are selected instead of recorded in skipped_review_steps, if selected_review_steps has more than three entries without strong review_escalation, or if reviewers are missing/recomputed outside planning, report a non-blocking stop with non_blocking_stop.source_step_id = planning_attack.

Input context:
- Implementation plan artifacts under review: ${{ input.planning_draft.artifacts | default: "No planning_draft artifacts are available in input context." }}
- UI design proposal artifacts: ${{ input.ui_intent_draft.artifacts | default: "No UI design proposal artifacts are available in input context." }}
- Selected implementation steps: ${{ input.planning_draft.selected_implementation_steps }}
- Selected review steps: ${{ input.planning_draft.selected_review_steps }}
- Review plan: ${{ input.planning_draft.review_plan }}
- Skipped review steps: ${{ input.planning_draft.skipped_review_steps | default: "No skipped reviewers recorded." }}
- Review escalation: ${{ input.planning_draft.review_escalation | default: "No review escalation recorded." }}'''

[steps.planning_attack.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/gate-attack-verdict-output.json"

[steps.planning_attack.next]
match = "${{ output.outcome }}"

[steps.planning_attack.next.cases]
approved = "approve_plan"
needs_revision = "planning_draft"

[steps.approve_plan]
name = "Approve implementation plan"
kind = "approval"

[steps.approve_plan.input]
prompt = '''This is a non-implementation approval phase. Do not inspect code, diffs, docs, or attached artifact bodies merely to prepare this gate; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Read planning_draft.summary as the human-facing plan proposal state and attach the `implementation-plan` artifact from planning_draft. On the first visit, include planning_attack.verdict. After a user-rejected plan is corrected, return directly to this gate and treat the old attack verdict only as evidence about the previous version; do not present it as critique of the revised artifact.
Do not recreate a summary by reading/paraphrasing the artifact body in the orchestrator; use the draft-produced summary as the approval-state text.
If the user asks for a plan/proposal file, retrieve/export the existing artifact referenced by baton/output artifacts; do not ask a worker to recreate it in a temp path.
Return approval approved only for explicit approval or rejected for requested plan changes as completed output; otherwise report a non-blocking stop.
After approval, planning_draft is the final approved plan contract.
Do not encode selected implementation roles or reviewers in approval; selected work and reviewers are planning_draft.selected_implementation_steps and planning_draft.selected_review_steps. skipped_review_steps are planning evidence only and must not be selected without later material surface evidence.

Input context:
- Implementation plan summary for approval: ${{ input.planning_draft.summary }}
- Implementation plan artifacts: ${{ input.planning_draft.artifacts | default: "No planning_draft artifacts are available in input context." }}
- Selected implementation steps: ${{ input.planning_draft.selected_implementation_steps }}
- Selected review steps: ${{ input.planning_draft.selected_review_steps }}
- Review plan: ${{ input.planning_draft.review_plan }}
- Skipped review steps: ${{ input.planning_draft.skipped_review_steps | default: "No skipped reviewers recorded." }}
- Planning attack verdict: ${{ input.planning_attack.verdict }}
- Previous implementation-plan gate decision: ${{ input.approve_plan | default: "No previous implementation-plan gate decision." }}'''

[steps.approve_plan.output]
schema = "schemas/approval-output.json"

[steps.approve_plan.next]
match = "${{ output.approval }}"

[steps.approve_plan.next.cases]
approved = "implementation"
rejected = "planning_draft"

[steps.implementation]
name = "Implementation"
kind = "fanout"
agent = "implementation"
agent_runtime.codex = { model = "gpt-5.6-luna", thinking_level = "high" }
max_parallel = 3
next = "review"

[steps.implementation.input]
branches = { first_of = ["${{ input.review.implementation_branches }}", "${{ input.planning_draft.selected_implementation_steps }}"] }
prompt = '''This is the implementation fanout owner phase. Inspect only outputs from implementation branches selected for the current activation.
Use the `implementation-plan` artifact from `planning_draft` as the approved execution contract.
Confirm every selected branch completed, supplied verification evidence, and stayed within scope.
On the first pass, planning_draft.selected_review_steps is the mandatory review baseline. After rework, review.review_branches is the mandatory re-review baseline.
You may widen that baseline when actual changed files or touched surfaces require another planned or previously skipped reviewer. Never remove a mandatory reviewer.
Return outcome ready_for_review with review_branches as the exact next review fanout and one reviewer_handoffs.<review_branch_id> entry per selected reviewer.
If incomplete, report a non-blocking stop with non_blocking_stop.source_step_id = implementation.

Input context:
- Approved implementation plan artifacts: ${{ input.planning_draft.artifacts | default: "No planning_draft artifacts are available in input context." }}
- Initial implementation branches: ${{ input.planning_draft.selected_implementation_steps }}
- Initial review baseline: ${{ input.planning_draft.selected_review_steps }}
- Mandatory re-review baseline: ${{ input.review.review_branches | default: "No prior re-review baseline." }}
- Backend implementation: ${{ input.backend_implementation | default: "backend_implementation was not selected in this activation." }}
- Frontend implementation: ${{ input.frontend_implementation | default: "frontend_implementation was not selected in this activation." }}
- Architecture artifact update: ${{ input.architecture_artifact_update | default: "architecture_artifact_update was not selected in this activation." }}'''

[steps.implementation.output]
template = "../../shared/templates/reviewer-handoff-template.md"
schema = "schemas/implementation-fanout-output.json"

[steps.implementation.branches.backend_implementation]
name = "Backend implementation"
agent = "backend"
agent_runtime.codex = { model = "gpt-5.6-terra", thinking_level = "high" }

[steps.implementation.branches.backend_implementation.input]
role = "backend"
prompt = '''Implement only the backend slice selected in the approved plan contract planning_draft.selected_implementation_steps.
Read artifact `implementation-plan` from `planning_draft` as the approved executable plan contract for this implementation slice. Treat a missing `implementation-plan` artifact as a non-blocking stop.
This workflow supports at most one backend_implementation worker; handle all backend work for the approved plan here and do not spawn duplicate backend workers.
Read prior step outputs from input.<step_id> fields only; do not rely on artifacts/results globals.
Preserve frozen research, architecture, execution plan, and user constraints.
Treat the approved proposal, plan, and source-contract rows assigned to backend_implementation as mandatory hard gates. Do not approximate, rename, or improvise around them without an approved mapping in the input context.
Treat red tests, lint failures, typecheck failures, or other verification failures caused by this worker's own in-scope backend changes as implementation work to fix and rerun, not as blockers by themselves.
Report a non-blocking stop only when fixing the failure requires missing external input, permission, an approved-contract change, a redesign/plan decision, or when repo/environment state makes continued work unsafe.
If a required source row cannot be satisfied in the assigned backend scope, or if implementation requires a deviation or exposes a contradiction in the approved contract, report a non-blocking stop with the smallest concrete approval question instead of redesigning silently.
Treat the approved implementation plan as the executable contract. Do not edit, complete, or reinterpret REASONS artifacts; if implementation reality conflicts with the plan, report a non-blocking stop or request an approved plan revision.
Return implemented as completed output, or report a non-blocking stop with non_blocking_stop.source_step_id = backend_implementation.
When implemented, emit the full implementer handoff as one `implementation-handoff` artifact and keep JSON compact: summary, changed_files, verification, artifacts. Do not embed the handoff body in JSON.
When rerun from review needs_changes, consume only input.review.implementer_handoffs.backend_implementation as actionable rework instructions. Use the aggregate review verdict and mandatory re-review baseline only for shared context; do not reconstruct rework from raw reviewer outputs.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = backend_implementation and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Approved implementation plan artifacts: ${{ input.planning_draft.artifacts | default: "No planning_draft artifacts are available in input context." }}
- Approved selected implementation steps: ${{ input.planning_draft.selected_implementation_steps }}
- Approved selected review steps: ${{ input.planning_draft.selected_review_steps }}
- Previous backend implementation artifacts: ${{ input.backend_implementation.artifacts | default: "No previous backend_implementation artifacts in input context." }}
- Branch-specific review rework handoff: ${{ input.review.implementer_handoffs.backend_implementation | default: "No backend rework handoff; this is the first implementation pass." }}
- Aggregate review verdict: ${{ input.review.verdict | default: "No aggregate review verdict; this is the first implementation pass." }}
- Mandatory re-review baseline: ${{ input.review.review_branches | default: "No mandatory re-review baseline; use the approved planning baseline." }}'''

[steps.implementation.branches.backend_implementation.output]
template = "../../shared/templates/implementer-handoff-template.md"
schema = "schemas/implementation-output.json"

[steps.implementation.branches.frontend_implementation]
name = "Frontend implementation"
agent = "frontend"
agent_runtime.codex = { model = "gpt-5.6-terra", thinking_level = "high" }

[steps.implementation.branches.frontend_implementation.input]
role = "frontend"
prompt = '''Implement only the frontend slice selected in the approved plan contract planning_draft.selected_implementation_steps.
Read artifact `implementation-plan` from `planning_draft` as the approved executable plan contract for this implementation slice. Treat a missing `implementation-plan` artifact as a non-blocking stop.
Read the approved `ui-design-proposal` HTML artifact from `ui_intent_draft` directly when it is applicable, together with the explicit `approve_ui_intent` approval evidence. Treat the HTML artifact, not only its implementation-plan translation, as the visual source of truth. Inspect its frames, annotations, states, selected pattern contracts, proof assets, and rendered-proof expectations before editing. Treat a missing applicable `ui-design-proposal`, wrong artifact id/content type, or missing explicit approval evidence as a non-blocking stop.
This workflow supports at most one frontend_implementation worker; handle all frontend work for the approved plan here and do not spawn duplicate frontend workers.
Read prior step outputs from input.<step_id> fields only; do not rely on artifacts/results globals.
Preserve frozen research, architecture, execution plan, and user constraints.
Treat the approved proposal, plan, and source-contract rows assigned to frontend_implementation as mandatory hard gates. Do not approximate, rename, or improvise around them without an approved mapping in the input context.
Before implementing named frontend frameworks, routers, UI kits, accessibility primitive libraries, or build/runtime integrations, inspect relevant current docs or repo-local package examples and record the docs/examples used in the implementer handoff. If the needed documentation cannot be accessed and the behavior is contract-significant, report a non-blocking stop instead of guessing.
For applicable non-trivial UI, capture rendered proof required by the approved HTML artifact and compare it against the approved frames/evidence for fidelity. Record proof locations and the comparison result in the implementer handoff. Text-only self-report is insufficient when the surface can be rendered locally; if rendering is blocked, report the concrete environment blocker.
For user-facing UI, decompose the slice into named, reviewable components/hooks/selectors; do not leave page composition, lists/cards, overlays/drawers/dialogs, detail sections, loading/error surfaces, and focus/interaction policy in one large component unless the approved plan grants an explicit exception.
For non-trivial user-facing UI, read the approved plan's `Frontend composition plan` before editing. If it is missing, too vague to name concrete components/file zones, or contradicts repo conventions, return blocked with the smallest concrete approval question instead of inventing the component architecture during implementation. Implement against that component map unless implementation reality exposes a contradiction that requires an approved plan revision.
Follow component colocation by default: keep component implementation, component-local types, styles, tests/stories/fixtures when present, and component-specific helpers near that component. Use shared contracts/types only for genuinely shared DTOs or cross-component APIs.
Identify the repo's UI kit/design-system primitives, tokens, and component conventions before creating controls or layout primitives. Use them by default; if none exists or none fits, record that evidence and use the approved primitive library or semantic native element.
Name every reusable component introduced or materially changed in the implementer handoff with its purpose, boundary, expected inputs/outputs, and intended reuse scope.
Do not finish with repeated className/token clusters, repeated control markup, repeated overlay/list/form scaffolds, or repeated status-state branches when an existing primitive/composite or named local component/helper would remove the duplication within scope.
Treat red tests, lint failures, typecheck failures, or other verification failures caused by this worker's own in-scope frontend changes as implementation work to fix and rerun, not as blockers by themselves.
Report a non-blocking stop only when fixing the failure requires missing external input, permission, an approved-contract change, a redesign/plan decision, or when repo/environment state makes continued work unsafe.
If a required source row cannot be satisfied in the assigned frontend scope, or if implementation requires a deviation or exposes a contradiction in the approved contract, report a non-blocking stop with the smallest concrete approval question instead of redesigning silently.
Treat the approved implementation plan as the executable contract. Do not edit, complete, or reinterpret REASONS artifacts; if implementation reality conflicts with the plan, report a non-blocking stop or request an approved plan revision.
Return implemented as completed output, or report a non-blocking stop with non_blocking_stop.source_step_id = frontend_implementation.
When implemented, emit the full implementer handoff as one `implementation-handoff` artifact and keep JSON compact: summary, changed_files, verification, artifacts. Do not embed the handoff body in JSON.
When rerun from review needs_changes, consume only input.review.implementer_handoffs.frontend_implementation as actionable rework instructions. Use the aggregate review verdict and mandatory re-review baseline only for shared context; do not reconstruct rework from raw reviewer outputs.
Treat `must_fix` and `should_fix` review findings routed to frontend_implementation as mandatory rework. Do not leave actionable current-scope `should_fix` items unresolved in the next handoff.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = frontend_implementation and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Approved implementation plan artifacts: ${{ input.planning_draft.artifacts | default: "No planning_draft artifacts are available in input context." }}
- Approved UI design proposal artifacts: ${{ input.ui_intent_draft.artifacts | default: "No UI design proposal artifacts are available in input context." }}
- Explicit UI design proposal approval evidence: ${{ input.approve_ui_intent | default: "No UI design proposal approval is available." }}
- Approved selected implementation steps: ${{ input.planning_draft.selected_implementation_steps }}
- Approved selected review steps: ${{ input.planning_draft.selected_review_steps }}
- Previous frontend implementation artifacts: ${{ input.frontend_implementation.artifacts | default: "No previous frontend_implementation artifacts in input context." }}
- Branch-specific review rework handoff: ${{ input.review.implementer_handoffs.frontend_implementation | default: "No frontend rework handoff; this is the first implementation pass." }}
- Aggregate review verdict: ${{ input.review.verdict | default: "No aggregate review verdict; this is the first implementation pass." }}
- Mandatory re-review baseline: ${{ input.review.review_branches | default: "No mandatory re-review baseline; use the approved planning baseline." }}'''

[steps.implementation.branches.frontend_implementation.output]
template = "../../shared/templates/implementer-handoff-template.md"
schema = "schemas/implementation-output.json"

[steps.implementation.branches.architecture_artifact_update]
