prompt = '''Update only approved architecture artifacts selected in the approved plan contract planning_draft.selected_implementation_steps.
Read artifact `implementation-plan` from `planning_draft` as the approved executable plan contract for this architecture artifact update slice. Treat a missing `implementation-plan` artifact as a non-blocking stop.
