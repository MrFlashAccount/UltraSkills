schema = "schemas/implementation-output.json"

[steps.review]
name = "Review"
kind = "fanout"
agent = "review"
agent_runtime.codex = { model = "gpt-5.6-luna", thinking_level = "high" }
max_parallel = 7
next = "${{ output.next }}"

[steps.review.input]
branches = "${{ input.implementation.review_branches }}"
prompt = '''This is the review fanout owner phase. Aggregate only review branches selected for the current activation.
Use the `implementation-plan` artifact from `planning_draft` and reviewer outputs as the approved review evidence.
If every selected reviewer passed with no actionable current-scope must-fix or should-fix findings, return outcome passed and next done.
If changes are required, return outcome needs_changes, next implementation, exact implementation_branches, one implementer_handoffs.<implementation_branch_id> per branch, and review_branches as the mandatory re-review baseline.
The re-review baseline must include failed reviewers and reviewers whose owned surfaces must be touched by the prescribed rework. The next implementation owner may widen this baseline after actual changes but may not narrow it.
If review cannot finish safely, report a non-blocking stop with non_blocking_stop.source_step_id = review and omit next.

Input context:
- Approved implementation plan artifacts: ${{ input.planning_draft.artifacts | default: "No planning_draft artifacts are available in input context." }}
- Current review branches: ${{ input.implementation.review_branches }}
- Architect review: ${{ input.architect_review | default: "architect_review was not selected in this activation." }}
- Backend review: ${{ input.backend_review | default: "backend_review was not selected in this activation." }}
- Frontend review: ${{ input.frontend_review | default: "frontend_review was not selected in this activation." }}
- Frontend taste review: ${{ input.frontend_taste_review | default: "frontend_taste_review was not selected in this activation." }}
- Security review: ${{ input.security_review | default: "security_review was not selected in this activation." }}
- Privacy review: ${{ input.privacy_review | default: "privacy_review was not selected in this activation." }}
- QA review: ${{ input.qa_review | default: "qa_review was not selected in this activation." }}'''

[steps.review.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/review-fanout-output.json"

[steps.review.branches.architect_review]
name = "Architect review"
agent = "architecture_critic"
agent_runtime.codex = { model = "gpt-5.6-sol", thinking_level = "high" }

[steps.review.branches.architect_review.input]
role = "architect"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Review implementation against approved architecture decision, ownership seams, dependency direction, compatibility surfaces, and artifact obligations.
