[steps.architecture_attack]
name = "Architecture attack"
kind = "worker"
agent = "architecture_critic"

[steps.architecture_attack.input]
role = "architect"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Start from a hostile prior: assume the change, proposal, draft, or packet is wrong, incomplete, overcomplicated, or under-evidenced until the artifact proves otherwise. Do not give credit for intent, author confidence, green self-reports, or plausible-sounding structure. PASS is allowed only after serious attack finds no evidence-backed must-fix finding. Do not invent bugs. Any FAIL must be evidence-backed with file/function/line or equivalent precise location, and explain why existing tests/checks did not catch it. Prefer small, evidence-backed blockers over broad commentary.
Attack the required `reasons-canvas-architecture` artifact for ownership seams, dependency direction, contract surfaces, frozen research carry-forward, architecture-owned decisions, execution-ready Operations, one-owner-per-file-zone, ordered workstreams, verification and rollback coverage, frontend composition when applicable, and compatibility risk. Treat a missing `reasons-canvas-architecture` artifact as a blocking architecture failure.
Attack selected_implementation_steps, selected_review_steps, review_plan, skipped_review_steps, and review_escalation for faithful routing from the Canvas: unique canonical branches, independently executable parallel implementation branches, no cross-branch output/completion/handoff dependencies, no overlapping same-role work, no optional or absence-confirmation reviewers in the active fan-out, no missing mandatory reviewer, no recomputed downstream selection, and no more than three reviewers without independent material risk classes. For architecture or documentation work assigned to architecture_artifact_update, require the approved Canvas itself to contain the target state; fail any plan that waits for a backend or frontend implementation handoff. For applicable non-trivial UI, require both frontend_review and frontend_taste_review and a concrete frontend composition contract in the Canvas. Treat any missing execution or review routing field as an architecture failure.
Return approved or needs_revision as completed output; otherwise report a non-blocking stop.
When reporting it, set non_blocking_stop.source_step_id = architecture_attack.

