name = "dev-harness"
version = 1
description = "End-to-end architecture and execution workflow for non-trivial code work: research attack, optional UI design proposal gate, one execution-ready architecture Canvas and approval, implementation and review fanout, and final user implementation approval. Use when a task needs structured evidence, staged approvals, role delegation, implementation slicing, or coordinated review before completion. Do not use when the user only needs a lightweight research verdict, a simple direct fix, a one-shot answer, or workflow creation/design."
start = "research_draft"
done = "done"

[loopPolicies.research_hostile_review]
steps = ["research_draft", "research_attack"]
entry = "research_draft"
boundary = "research_attack"
maxIterations = 2
onLimit = "approve_research"

[loopPolicies.ui_design_hostile_review]
steps = ["ui_intent_draft", "ui_intent_attack"]
entry = "ui_intent_draft"
boundary = "ui_intent_attack"
maxIterations = 2
onLimit = "approve_ui_intent"

[loopPolicies.architecture_hostile_review]
steps = ["architecture_draft", "architecture_attack"]
entry = "architecture_draft"
boundary = "architecture_attack"
maxIterations = 2
onLimit = "approve_architecture"

[loopPolicies.code_review]
steps = ["implementation", "review"]
entry = "implementation"
boundary = "review"
maxIterations = 3
onLimit = "approve_implementation"

[steps.research_draft]
name = "Research draft"
kind = "worker"
agent = "researcher"

[steps.research_draft.input]
role = "researcher"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Before creating the research artifact or moving toward a proposal, run a user dialogue solution exploration pass when the feature/task is under-specified, has meaningful product/API/architecture choices, or would otherwise force hidden assumptions:
- Inspect the codebase first for questions answerable from existing code, docs, tests, contracts, or prior artifacts.
- When multiple plausible solution directions remain, report a non-blocking stop with non_blocking_stop.source_step_id = research_draft and a user-facing discussion prompt in non_blocking_stop.needed for the orchestrator to discuss with the user through the non-blocking stop flow.
- The discussion prompt must present the main solution options, trade-offs, edge cases, failure modes, migration/compatibility impact, operational cost, and your recommended direction.
- Ask one focused discussion question at a time. After the orchestrator resolves it, continue the same research step and either ask the next needed discussion question or proceed only when the solution direction, edge cases, and scope decisions are resolved.
- Phrase every user-answerable non_blocking_stop.needed as a direct user-facing question; the orchestrator must route it to the user as a question, not answer it from inference or convert it into a summary.
Do not create `reasons-canvas-research` before the needed user dialogue is complete or evidence shows no user dialogue is needed.
Read the task context, gather local/project evidence, identify constraints, risks, open questions, and architecture-sensitive pressure.
Decide whether this task needs the optional UI design proposal gate. Record the mandatory `UI design needed: yes | no` decision and its evidence-backed rationale in the Requirements section of `reasons-canvas-research`. Return output.next_step = ui_intent_draft when the approved slice materially changes a user-facing interface, interaction model, information hierarchy, responsive behavior, or visual/product direction and therefore needs a product-surface proposal before architecture. Return output.next_step = architecture_draft for backend, infrastructure, tooling, documentation, non-visual behavior, or truly trivial UI copy/bug work where architecture can proceed safely from research alone. Missing UI evidence is not a reason to skip the gate: if UI work is material but its design basis is missing, route to ui_intent_draft so that step can request the missing evidence. Include the selected next step in output.summary and preserve it across revisions unless new evidence changes the task surface.
Create exactly one first-class human-facing research artifact named `reasons-canvas-research`. Do not create any separate legacy research artifact or structured legacy output.
Fill only the research-owned depth in `reasons-canvas-research`: evidence-backed Requirements, observed domain Entities, and research-level constraints, candidate options, risks, norms, safeguards, and open tensions. Do not finalize architecture, file-level operations, or implementation work; mark those as questions or constraints for later phases. Emit artifact metadata for `reasons-canvas-research` in artifacts[].
Emit a compact output.summary as the human-facing research proposal state for approval gates. Summarize the artifact's current proposal state, major decisions, unresolved tensions, and why it is ready for attack/approval without embedding the artifact body.
Do not create arbitrary temp/export files for handoff; the artifact metadata/path accepted into baton is the source of truth.
Return outcome ready_for_attack when the initial draft or a research_attack-requested revision is ready for attack.
When missing implementation-critical input is answerable by the user, report a non-blocking stop with non_blocking_stop.source_step_id = research_draft and the smallest concrete question or permission needed.
For any user-answerable research non-blocking stop, non_blocking_stop.needed must be the exact user-facing question to ask.
Report a non-blocking stop for non-user-answerable unsafe or impossible progress as well, but make non_blocking_stop.needed distinguish the external non-blocking stop from a user decision.
When revising after research_attack feedback or approve_research rejection, read feedback from input.research_attack and input.approve_research and address it explicitly while preserving approved constraints. If the latest approve_research output is rejected, return ready_for_approval after the correction; do not send that user-requested revision through research_attack again.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = research_draft and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Previous research artifacts: ${{ input.research_draft.artifacts | default: "No previous research artifacts in input context." }}
- Research attack feedback to address: ${{ input.research_attack.verdict | default: "No prior research_attack feedback." }}
- Human research gate feedback to address: ${{ input.approve_research.feedback | default: "No prior approve_research feedback." }}'''

[steps.research_draft.output]
template = "../../shared/templates/reasons/reasons-canvas-template.md"
schema = "schemas/research-draft-output.json"

[steps.research_draft.next]
match = "${{ output.outcome }}"

[steps.research_draft.next.cases]
ready_for_attack = "research_attack"
ready_for_approval = "approve_research"

[steps.research_attack]
name = "Research attack"
kind = "worker"
agent = "research_critic"

[steps.research_attack.input]
role = "researcher"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Start from a hostile prior: assume the change, proposal, draft, or Canvas is wrong, incomplete, overcomplicated, or under-evidenced until the artifact proves otherwise. Do not give credit for intent, author confidence, green self-reports, or plausible-sounding structure. PASS is allowed only after serious attack finds no evidence-backed must-fix finding. Do not invent bugs. Any FAIL must be evidence-backed with file/function/line or equivalent precise location, and explain why existing tests/checks did not catch it. Prefer small, evidence-backed blockers over broad commentary.
Read artifact `reasons-canvas-research` from `research_draft` and attack it for missing evidence, unsafe assumptions, scope drift, sensitive surfaces, unclear approval questions, and fake architecture/implementation certainty. Also attack research_draft.next_step against the artifact's mandatory `UI design needed: yes | no` decision and rationale: fail architecture_draft when the slice materially changes a user-facing interface, interaction model, information hierarchy, responsive behavior, or visual/product direction, and fail ui_intent_draft when there is no evidence-backed UI surface. Treat missing or unsupported UI-gate routing as a research failure, not a downstream UI-worker decision. Treat a missing `reasons-canvas-research` artifact as a blocking research failure.
Return approved or needs_revision as completed output; otherwise report a non-blocking stop.
When reporting it, set non_blocking_stop.source_step_id = research_attack.

Input context:
- Research artifacts: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}
- Researcher-selected next step: ${{ input.research_draft.next_step }}'''

[steps.research_attack.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/gate-attack-verdict-output.json"

[steps.research_attack.next]
match = "${{ output.outcome }}"

[steps.research_attack.next.cases]
approved = "approve_research"
needs_revision = "research_draft"

[steps.approve_research]
name = "Approve research"
kind = "approval"
next = "${{ input.research_draft.next_step }}"
onReject = "research_draft"

[steps.approve_research.input]
summary = "${{ input.research_draft.summary }}"
artifacts = ["${{ input.research_draft.artifacts }}"]

[steps.approve_research.input.verdict]
outcome = "${{ input.research_attack.outcome }}"
summary = "${{ input.research_attack.verdict.summary }}"
findings = "${{ input.research_attack.verdict.findings }}"

[steps.approve_research.input.verdict.include_when]
selector = "${{ input.research_draft.outcome }}"
equals = "ready_for_attack"

[steps.ui_intent_draft]
name = "UI design proposal draft"
kind = "worker"
agent = "frontend-taste"

[steps.ui_intent_draft.input]
role = "frontend-taste"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Use frontend-taste judgment. Read the approved/current `reasons-canvas-research` artifact from `research_draft` as the source of truth and produce one first-class human-facing HTML artifact named `ui-design-proposal` with content_type `text/html`, then derive the seven required PNG reference captures from that final HTML.
Use the shared HTML template's REASONS interface as the mandatory content architecture. Translate the approved research Canvas into seven inspectable arguments instead of reproducing its Markdown or filling a long scrolling document: Requirements = a short prioritized solution-independent interface contract covering functional capabilities, interaction behavior, information/content, non-functional quality constraints, out-of-scope boundaries, and success checks; Entities = a domain-object relationship map; Approach = controlled direction comparison; Structure = annotated chosen-surface anatomy and containment; Operations = a primary-scenario storyboard; Norms = observable interface laws; Safeguards = rendered stress cases and approval gates. Requirements is intentionally text-first: use concise observable and testable `MUST`/`SHOULD` bullets, and do not place a selected-direction mockup or other solution-biased image there before Approach. Each later section must use the visual form that fits its reasoning job. Do not collapse the artifact into either prose-heavy documentation or a four-image direction gallery: directions are evidence inside Approach, not the whole proposal.
The artifact must preserve a visible reasoning chain from requirement to entity model to chosen approach to surface anatomy to behavior to norms to failure proof. Use real product content or honest placeholders outside proposed-screen frames. Put claims next to the HTML/CSS mock surface, map, storyboard moment, or stress case that proves them; do not rely on decorative scores, unsupported checklists, or rationale separated from visual evidence by long scrolling. Treat the template shell as neutral evidence navigation, not product visual direction; proposed product surfaces must follow the available design basis.
This step is a lightweight UI/product-surface design proposal gate before architecture, not a separate design-law authoring workflow. It must not edit or invent `DESIGN.md`, choose durable visual law, or define file/component implementation architecture. The design-routing logic belongs inside `ui-design-proposal`: product/surface route, design-basis preflight, user decisions, visually comparable direction frames when needed, chosen desktop/mobile proof, annotations, component and copy inventory, typography/rhythm, spacing/composition, color/emphasis/contrast, focus-visible/target affordance, motion/reduced-motion, wrapping/truncation, product-level data hierarchy, evidence/proof expectations, open tensions, portable frontend-taste guidance allowed, what must not be inferred, and whether create-design/frontend-taste direction work is required before architecture. Include card/list anatomy and visual rules only when that pattern is selected; include drawer/sidebar/bottom-sheet placement and states only when that pattern is selected.
For non-trivial user-facing UI, the `ui-design-proposal` must capture the interface intent at product-surface depth: user/task, primary and secondary actions, user questions/decisions, first-read/work-surface reading order, screen/zones needed, product-level data hierarchy, content model/data hierarchy, text wrapping/truncation policy, required visible states, interaction expectations, density/tone, responsive containment, design-law or existing-UI basis, visual evidence/proof assets, rendered-proof expectations, and any UI open tensions that architecture must preserve. Describe semantic screen structure such as toolbar, filters, list/table, detail drawer/sidebar, form, dialog, empty/error/loading states; do not choose file paths, component filenames, hooks, state owners, or storage boundaries.
For non-trivial UI, explicitly decide what each selected surface pattern should show, defer, truncate, or hide. Do not leave raw technical metadata, debug noise, or long token placement for implementation to guess. When card/list patterns are selected, specify their anatomy/content model and visual rules. When drawer/sidebar/bottom-sheet patterns are selected, specify breakpoint placement, containment, open/closed/no-selection behavior, focus return, animation, and reduced-motion behavior. Do not introduce cards or drawers merely because the template supports them. Define where wrapping is allowed and where it is forbidden: buttons, tabs, segmented controls, chips, badges, pills, and compact status labels must not wrap unless the design basis explicitly approves it; long labels/tokens must be shortened, truncated, moved to detail, or otherwise contained. One-letter wraps are never acceptable proof.
Always include a `User Questions / Decisions` section for non-trivial UI. Put 3-7 concrete user-facing questions or decisions there when useful, with status Answered, Assumed, or Needs user approval. If an unanswered question materially changes layout, primary action, risk posture, density, or visual direction, report a non-blocking stop with non_blocking_stop.source_step_id = ui_intent_draft and the smallest concrete user-facing question instead of guessing.
Use existing screenshots, approved references, proof pages, prior visual proposals, or current UI captures as design evidence when they are already available in the task/repo/context, but do not embed or reproduce them as proposal images. Record what each source proves and what frontend should preserve or ignore. Build every proposed screen, direction, storyboard moment, responsive variant, and stress state directly inside `ui-design-proposal` as semantic HTML and CSS. Isolate each related mockup group from the proposal shell with Declarative Shadow DOM: place it under a custom-element host with `<template shadowrootmode="open">`, keep all mockup CSS inside that shadow root, reset inherited host presentation with `:host { all: initial; ... }`, and add layout/paint/style containment. Proposal-shell selectors must not style mockup internals, and mockup selectors must not escape into the proposal shell. Do not call image generation, use `<img>`, depend on external assets or network resources, substitute SVG/canvas drawings for screen markup, or hand-author raster proposal art. Define one shared token and component-class system per isolated mockup group and reuse it so desktop, narrow, direction, and state frames remain recognizably the same interface. Critical actions, headings, statuses, and data labels must be legible, selectable text with product-relevant copy. At minimum include the selected desktop and mobile/narrow compositions; include 3-4 structurally distinct direction frames when direction comparison is required; include materially different screens and important loading, empty, error, degraded, selected/detail, dense-data, or pathological-data states needed to make the proposal inspectable. The HTML must be self-contained and open locally without a build step. Preserve the template's hash-addressable REASONS views, `data-ui-proposal-ready` hook, and one `data-ui-proposal-capture="<view-id>"` selector on each REASONS section. Explicitly state the rendered proof/screenshots the implementation or review must capture from the actual product; do not silently accept text-only implementation evidence when the surface can be rendered locally.
After the HTML is final and already written to disk, do not operate the browser or create screenshots manually. Call the standalone repository script `<repository-root>/scripts/render-html-selector-captures.mjs`; it uses the runtime's built-in `Bun.WebView` and does not import Playwright or Orbita `lib`, read the workflow document, discover artifacts, or choose paths. You must pass the existing absolute HTML path and every capture's selector, URL hash, and absolute output path explicitly. Invoke it once with `bun <repository-root>/scripts/render-html-selector-captures.mjs --html <absolute-ui-design-proposal-path> --chrome-path <absolute-chrome-or-chromium-executable-path> --viewport-width 1440 --viewport-height 1000 --timeout-ms 30000 --capture {"selector":"[data-ui-proposal-capture=\"requirements\"]","url_hash":"requirements","output_path":"<artifact-output-directory>/ui-design-proposal-requirements.png"} --capture {"selector":"[data-ui-proposal-capture=\"entities\"]","url_hash":"entities","output_path":"<artifact-output-directory>/ui-design-proposal-entities.png"} --capture {"selector":"[data-ui-proposal-capture=\"approach\"]","url_hash":"approach","output_path":"<artifact-output-directory>/ui-design-proposal-approach.png"} --capture {"selector":"[data-ui-proposal-capture=\"structure\"]","url_hash":"structure","output_path":"<artifact-output-directory>/ui-design-proposal-structure.png"} --capture {"selector":"[data-ui-proposal-capture=\"operations\"]","url_hash":"operations","output_path":"<artifact-output-directory>/ui-design-proposal-operations.png"} --capture {"selector":"[data-ui-proposal-capture=\"norms\"]","url_hash":"norms","output_path":"<artifact-output-directory>/ui-design-proposal-norms.png"} --capture {"selector":"[data-ui-proposal-capture=\"safeguards\"]","url_hash":"safeguards","output_path":"<artifact-output-directory>/ui-design-proposal-safeguards.png"}`; quote each JSON argument as required by the shell. The script opens one headless `Bun.WebView`, loads the HTML once, switches each supplied URL hash in-page, captures the supplied selector through Chrome DevTools Protocol, and writes each PNG to the exact path you supplied. Only after it succeeds, call the validating write-output command with the existing HTML path and those exact seven PNG paths under the required stable artifact ids; do not call write-output before every output file exists. If the renderer exits non-zero, report a non-blocking stop with non_blocking_stop.source_step_id = ui_intent_draft and include its concise stderr; never substitute manual browser work, image generation, or HTML-only output.
If design law, existing UI basis, product context, visual evidence, or user choice is missing and the task needs high-confidence new screen direction, report a non-blocking stop with non_blocking_stop.source_step_id = ui_intent_draft and the smallest concrete user-facing question, screenshot/proof request, or create-design/frontend-taste routing need. For small conservative UI work, record the fallback basis instead of stopping.
Emit exactly eight artifacts[] entries: `ui-design-proposal` with content_type `text/html` and the seven stable capture ids above with content_type `image/png`, plus a compact output.summary as the human-facing UI design proposal state. The HTML remains the semantic source of truth; the PNGs are the portable visual references for attack, approval, implementation, and review.
Return ready_for_attack for the initial proposal or a ui_intent_attack-requested revision, or ready_for_approval after correcting an approve_ui_intent rejection as completed output; otherwise report a non-blocking stop with non_blocking_stop.source_step_id = ui_intent_draft.
When revising after ui_intent_attack feedback or approve_ui_intent rejection, read feedback from input.ui_intent_attack and input.approve_ui_intent and address it explicitly while preserving approved research constraints. If the latest approve_ui_intent output is rejected, return ready_for_approval after the correction; do not send that user-requested revision through ui_intent_attack again.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = ui_intent_draft and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

Input context:
- Research artifacts, including required `reasons-canvas-research`: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}
- Research attack verdict: ${{ input.research_attack.verdict }}
- Human research approval: ${{ input.approve_research }}
- Previous UI design proposal artifacts: ${{ input.ui_intent_draft.artifacts | default: "No previous ui_intent_draft artifacts in input context." }}
- UI design proposal attack feedback to address: ${{ input.ui_intent_attack.verdict | default: "No prior ui_intent_attack feedback." }}
- Human UI design proposal gate feedback to address: ${{ input.approve_ui_intent.feedback | default: "No prior approve_ui_intent feedback." }}'''

[steps.ui_intent_draft.output]
template = "templates/ui-design-proposal-html-template.html"
schema = "schemas/ui-intent-draft-output.json"

[steps.ui_intent_draft.next]
match = "${{ output.outcome }}"

[steps.ui_intent_draft.next.cases]
ready_for_attack = "ui_intent_attack"
ready_for_approval = "approve_ui_intent"

[steps.ui_intent_attack]
name = "UI design proposal attack"
kind = "worker"
agent = "ui_intent_critic"

[steps.ui_intent_attack.input]
role = "frontend-taste"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Start from a hostile prior: assume the UI design proposal draft is wrong, incomplete, overcomplicated, unsupported by research, or drifting into design-law/code architecture until the artifact proves otherwise. Do not give credit for intent, author confidence, or plausible-sounding structure.
Read the self-contained `ui-design-proposal` HTML artifact and all seven derived PNG reference captures from `ui_intent_draft`. Inspect the HTML's semantic markup and CSS, then inspect every PNG visually instead of trusting annotations or filenames alone. Treat the PNGs as the portable rendered evidence used downstream and the HTML as their semantic source. Attack the proposal for missing user/task grounding, weak first-read/action hierarchy, hierarchy defects, weak typography or rhythm, inconsistent spacing or composition, arbitrary color/emphasis or insufficient contrast, missing focus-visible or target affordance, broken responsive containment, purposeless motion or missing reduced-motion behavior, generic UI slop, missing product-level data hierarchy, missing applicable-pattern anatomy/state rules, missing wrapping/truncation policy, missing required states, unsupported design basis, missing product/surface routing, hidden assumptions, and over-specific code/component architecture. Fail a proposal whose mockup groups remain in ordinary light DOM, omit `<template shadowrootmode="open">`, rely on proposal-shell selectors for mockup styling, leak mockup selectors into the shell, or fail to reset and contain the shadow host. Also fail image generation, `<img>`, independently authored raster proposal art, external assets or network resources, SVG/canvas as a screen substitute, prose placeholders instead of inspectable HTML/CSS surfaces, or missing separate desktop/mobile and materially distinct required direction/screen/state compositions. Fail any missing, stale, clipped, browser-chrome-contaminated, mislabeled, or non-matching REASONS capture, as well as illegible critical copy and cross-view drift where desktop, mobile, or state markup no longer represents the same selected interface. Card/list and drawer/sidebar concerns apply only when the proposal selects those patterns; do not require or invent them for forms, tables, documents, navigation, or other surfaces. Do not invent `DESIGN.md` or treat its absence as permission to create design law. Treat a missing `ui-design-proposal` artifact or missing required PNG capture as a blocking UI design proposal failure.
Require the artifact to preserve the full REASONS evidence chain: Requirements prioritized functional/interaction/information/quality contract with out-of-scope boundaries and success checks, Entities relationship map, Approach controlled options, Structure annotated anatomy, Operations storyboard, Norms observable laws, and Safeguards rendered stress cases and approval gates. Requirements is the deliberate text-first exception: fail it when bullets are verbose, unprioritized, solution-specific, untestable, or biased by a selected-direction mockup. Reject a Markdown-like document merely restyled as cards or tables everywhere else, long prose whose claims are detached from proof, duplicate navigation or decorative chrome that does not help the decision, and a proposal that consists mainly of 3-4 direction images. Reject any later section that uses the same generic content treatment when its reasoning job requires a map, annotated composition, sequence, or stress proof.
For taste-sensitive or materially new UI, require 3-4 viable directions and require each direction to have its own inspectable rendered composition frame, a product-relevant structural/composition difference, and visible demonstration of typography/rhythm, spacing/composition, emphasis/contrast, focus-visible/target affordance, and motion/reduced-motion where applicable. Reject prose-only direction comparison, identical or near-identical frames merely relabeled or recolored, and filled contract tables or checklists unsupported by the rendered frames. A conservative/trivial existing-pattern exception is valid only when the artifact names the exact existing pattern and evidence being preserved and does not disguise materially new UI as conservative work.
Return approved or needs_revision as completed output; otherwise report a non-blocking stop.
When reporting it, set non_blocking_stop.source_step_id = ui_intent_attack.

Input context:
- UI design proposal artifacts: ${{ input.ui_intent_draft.artifacts | default: "No UI design proposal artifacts are available in input context." }}
- Research artifacts: ${{ input.research_draft.artifacts | default: "No research artifacts are available in input context." }}'''

[steps.ui_intent_attack.output]
template = "../../shared/templates/review-verdict-template.md"
schema = "schemas/gate-attack-verdict-output.json"

[steps.ui_intent_attack.next]
match = "${{ output.outcome }}"

[steps.ui_intent_attack.next.cases]
approved = "approve_ui_intent"
needs_revision = "ui_intent_draft"

[steps.approve_ui_intent]
name = "Approve UI design proposal"
kind = "approval"

[steps.approve_ui_intent.input]
summary = "${{ input.ui_intent_draft.summary }}"
artifacts = ["${{ input.ui_intent_draft.artifacts }}"]

[steps.approve_ui_intent.input.verdict]
outcome = "${{ input.ui_intent_attack.outcome }}"
summary = "${{ input.ui_intent_attack.verdict.summary }}"
findings = "${{ input.ui_intent_attack.verdict.findings }}"

[steps.approve_ui_intent.input.verdict.include_when]
selector = "${{ input.ui_intent_draft.outcome }}"
equals = "ready_for_attack"

[steps.approve_ui_intent.next]
match = "${{ output.approval }}"

[steps.approve_ui_intent.next.cases]
approved = "architecture_draft"
rejected = "ui_intent_draft"

[steps.architecture_draft]
name = "Architecture draft"
kind = "worker"
agent = "architect"

[steps.architecture_draft.input]
role = "architect"
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Read the approved/current `reasons-canvas-research` artifact from `research_draft` as the research source of truth and strictly follow it.
Honor research_draft.next_step and the matching `UI design needed: yes | no` decision in the approved research artifact. When next_step is ui_intent_draft, read the approved/current `ui-design-proposal` artifact from `ui_intent_draft` as the UI/product-surface source of truth. Preserve its user task, product/surface route, screen/zones, first-read/action hierarchy, required states, interaction expectations, design-law basis, visual evidence/proof asset constraints, and open UI tensions. When next_step is architecture_draft, proceed directly without a UI artifact or UI approval and carry the research artifact's no-design rationale into the architecture artifact; do not invent a UI proposal or treat its absence as missing evidence. Do not rewrite visual hierarchy or UI taste in architecture; translate only the code/system implications needed to preserve an applicable approved UI design proposal.
Produce the minimal architecture decision and execution-ready structural contract required by the approved research in the `reasons-canvas-architecture` artifact and a compact output.summary as the human-facing architecture proposal state for approval gates. This REASONS Canvas is the only human-facing architecture/execution artifact; do not create a second planning artifact or embed the Canvas body in JSON.
Before finalizing output.summary or `reasons-canvas-architecture`, explicitly identify the public contract and API surfaces affected by the task: exported APIs, CLI/user-facing commands, schemas, workflow interfaces, integration boundaries, compatibility promises, and observable behavior. If code, docs, or existing contracts answer a question, inspect them instead of asking the user.
When user-owned choices remain about public contract shape, API compatibility, naming, migration behavior, or accepted breakage, report a non-blocking stop with non_blocking_stop.source_step_id = architecture_draft and the smallest focused non_blocking_stop.needed question for the orchestrator to resolve through the non-blocking stop flow; include your recommended answer in non_blocking_stop.summary or non_blocking_stop.needed.
For any user-answerable architecture non-blocking stop, non_blocking_stop.needed must be the exact user-facing question to ask; the orchestrator must route it to the user as a question, not answer it from inference or convert it into a summary.
After the orchestrator resolves the recoverable non-blocking stop, continue the same architecture step from the resolved public contract/API decision and proceed only when the needed decisions are resolved or evidence shows no such discussion is needed.
When `reasons-canvas-research` exists, derive one new immutable human-facing workflow artifact named `reasons-canvas-architecture`. Copy forward research-owned Requirements and observed domain Entities as frozen input unless new evidence proves a conflict; record any correction in the new architecture artifact instead of editing the research artifact. Own the architecture-depth sections: structural Entities, Approach, Structure, execution-ready Operations, Norms, Safeguards, and remaining open tensions.
Make Operations directly executable without a second planning artifact: organize the work into ordered workstreams, give each workstream one owner role and non-overlapping file/module zones, name the planned additions/changes and dependencies, and define observable completion and verification evidence. Put compatibility limits, rollback triggers and the smallest safe rollback path in Safeguards. Keep this at planning depth: do not emit code, diffs, shell command sequences, or patch recipes.
Treat selected implementation branches as parallel and independently executable from the approved `reasons-canvas-architecture` artifact and repository state. Do not make one selected branch depend on another selected branch's output, completion, changed files, or implementation handoff. In particular, architecture or documentation updates assigned to architecture_artifact_update must derive their target state directly from the approved Canvas; if the Canvas does not contain enough information, complete or revise it before approval instead of planning a backend or frontend handoff dependency.
When frontend_implementation is selected for non-trivial user-facing UI, include the frontend composition contract in Structure and Operations: page/screen containers, feature and layout components, primitives/UI-kit usage, overlays/composites, state surfaces, hooks/selectors/adapters, file zones, state ownership, and responsibility boundaries. Preserve the approved `ui-design-proposal` by reference; do not duplicate or rewrite its visual/product contract in the Canvas. If the frontend slice is non-UI, trivial, or intentionally preserves an existing component shape, record that reason instead of inventing components.
Emit selected_implementation_steps as the exact unique implementation fan-out target using only backend_implementation, frontend_implementation, and architecture_artifact_update. Collapse overlapping same-role work into one canonical branch; if ownership cannot be made disjoint, report a non-blocking stop instead of approving an ambiguous contract.
Emit selected_review_steps, review_plan, skipped_review_steps when applicable, and review_escalation when more than three reviewers are selected. Select only reviewers that must actually run: default to one independent reviewer, use two for two independent material risk classes, three for structural/runtime plus verification-heavy work, and exceed three only with evidence-backed escalation. Keep review_plan.reviewers aligned with selected_review_steps. For applicable non-trivial UI, always select both frontend_review and frontend_taste_review.
Include the selected implementation route, selected reviewers, main risks, verification shape, and rollback shape in output.summary without embedding the Canvas body.
Do not create arbitrary temp/export files for handoff; the artifact metadata/path accepted into baton is the source of truth.
If architecture work is minimal, record the explicit minimal/no-structural-change decision in `reasons-canvas-architecture` and output.summary.
Return ready_for_attack for the initial draft or an architecture_attack-requested revision as completed output, or report a non-blocking stop with non_blocking_stop.source_step_id = architecture_draft.
When revising after architecture_attack feedback or approve_architecture rejection, read feedback from input.architecture_attack and input.approve_architecture and address it explicitly while preserving frozen research inputs and approved architecture constraints. If the latest approve_architecture output is rejected, return ready_for_approval after the correction; do not send that user-requested revision through architecture_attack again.
Loop continuity across workflow loop iterations is prompt based: rely only on workflow input context and prior step outputs; do not assume persistent draft/attack worker reuse across iterations.
If concise clarification is needed, do not ask the user directly; report a non-blocking stop with non_blocking_stop.source_step_id = architecture_draft and put the user-facing clarification prompt in non_blocking_stop.needed. After the orchestrator resolves it, continue the same clarification session without restart or context widening.

