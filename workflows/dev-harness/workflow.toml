[steps.approve_implementation]
name = "Approve implementation result"
kind = "approval"

[steps.approve_implementation.input]
summary = "${{ input.implementation.summary }}"
artifacts = ["${{ input.implementation.artifacts }}"]

[steps.approve_implementation.input.verdict]
outcome = "${{ input.review.outcome }}"
summary = "${{ input.review.verdict.summary }}"
findings = "${{ input.review.verdict.findings }}"

[steps.approve_implementation.input.verdict.include_when]
selector = "${{ input.implementation.outcome }}"
equals = "ready_for_review"

[steps.approve_implementation.next]
match = "${{ output.approval }}"

[steps.approve_implementation.next.cases]
approved = "done"
rejected = "implementation"

[steps.done]
name = "Done"
kind = "done"

[steps.done.input]
prompt = '''This is a non-implementation phase. Inspect code, diffs, docs, artifacts, and prior evidence read-only; do not run tests, lint, validation, typecheck, build checks, `git diff --check`, or equivalent verification commands.
Workflow completed only because the user explicitly approved the latest implementation result.
Project approve_implementation, implementation.summary, review.verdict, and review.outcome as the final result; do not summarize artifacts/results globals.
If review.outcome is needs_changes, state that the automated code-review loop ended after its configured three-cycle limit with unresolved findings and that the user explicitly accepted the result. Do not claim that review passed.
If implementation.outcome is ready_for_user_approval, state that the latest user-requested rework was implemented and explicitly approved, but was not sent through another automated review cycle. Do not claim that post-review user feedback was reviewer-verified.

Input context:
- Final user implementation decision: ${{ input.approve_implementation }}
- Latest implementation summary: ${{ input.implementation.summary }}
- Final review outcome: ${{ input.review.outcome }}
- Final review verdict: ${{ input.review.verdict }}
'''
