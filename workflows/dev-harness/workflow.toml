Input context:
- Approved implementation plan artifacts: ${{ input.planning_draft.artifacts | default: "No planning_draft artifacts are available in input context." }}
- Approved selected implementation steps: ${{ input.planning_draft.selected_implementation_steps }}
- Approved selected review steps: ${{ input.planning_draft.selected_review_steps }}
- Previous architecture artifact update artifacts: ${{ input.architecture_artifact_update.artifacts | default: "No previous architecture_artifact_update artifacts in input context." }}
- Branch-specific review rework handoff: ${{ input.review.implementer_handoffs.architecture_artifact_update | default: "No architecture artifact rework handoff; this is the first implementation pass." }}
- Aggregate review verdict: ${{ input.review.verdict | default: "No aggregate review verdict; this is the first implementation pass." }}
- Mandatory re-review baseline: ${{ input.review.review_branches | default: "No mandatory re-review baseline; use the approved planning baseline." }}'''

[steps.implementation.branches.architecture_artifact_update.output]
